<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Calendario Escolar</title>
<link rel="icon" type="image/png" href="Logo.png">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

#planner {
  margin-top: 10px;
}

.monthHeader {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin-bottom:10px;
}

.grid {
  display:grid;
  grid-template-columns: repeat(7, 1fr);
  gap:6px;
}

.cell {
  background:white;
  border-radius:10px;
  padding:10px;
  min-height:50px;
  cursor:pointer;
  position:relative;
  border:1px solid #ddd;
}

.dot {
  width:8px;
  height:8px;
  background:black;
  border-radius:50%;
  position:absolute;
  bottom:6px;
  right:6px;
}

#dayPanel {
  margin-top:20px;
  background:white;
  padding:15px;
  border-radius:12px;
  display:none;
}

textarea {
  width:100%;
  min-height:80px;
  margin-top:5px;
}

button {
  margin-top:8px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.chat-box {
  margin-top:20px;
  background:white;
  padding:15px;
  border-radius:12px;
}
</style>
</head>

<body>

<h2>Calendario escolar</h2>

<div class="topbar">
  <div id="g_id_onload"
    data-client_id="339716745421-9m32g145kb2pibk0ff71thv9bru2uhpd.apps.googleusercontent.com"
    data-callback="handleCredentialResponse"
    data-ux_mode="popup">
  </div>
  <div class="g_id_signin"></div>

  <span id="userStatus">No logueado</span>
</div>

<div class="monthHeader">
  <button onclick="changeMonth(-1)">◀</button>
  <h3 id="monthTitle"></h3>
  <button onclick="changeMonth(1)">▶</button>
</div>

<div id="planner"></div>

<div id="dayPanel"></div>

<div class="chat-box">
  <h3>Asistente</h3>
  <input id="chatInput" placeholder="Pregunta algo..."/>
  <button onclick="preguntarIA()">Enviar</button>
  <div id="chatResponse"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBptDjBsGFfegLCKABQt5bdcbB42Wq0vo4",
  authDomain: "data-plantilla.firebaseapp.com",
  databaseURL: "https://data-plantilla-default-rtdb.firebaseio.com",
  projectId: "data-plantilla",
  storageBucket: "data-plantilla.firebasestorage.app",
  messagingSenderId: "359795727645",
  appId: "1:359795727645:web:d75d627708129ed97555f4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const OWNER_EMAIL = "alanmosimann@gmail.com";

let isOwner = false;
let currentDate = new Date();
let cache = {};

function format(d){
  return d.toISOString().split("T")[0];
}

function monthName(m){
  return ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"][m];
}

function getDays(y,m){
  let d = new Date(y,m,1);
  let out = [];
  while(d.getMonth()===m){
    out.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return out;
}

async function renderCalendar(){

  const planner = document.getElementById("planner");
  planner.innerHTML="";

  document.getElementById("monthTitle").innerText =
    monthName(currentDate.getMonth()) + " " + currentDate.getFullYear();

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  const days = getDays(year,month);

  const grid = document.createElement("div");
  grid.className = "grid";

  for(let day of days){

    const key = format(day);

    const snap = await get(ref(db,"calendar/"+key));
    const data = snap.exists()?snap.val():null;

    const cell = document.createElement("div");
    cell.className = "cell";

    cell.innerHTML = `
      <div>${day.getDate()}</div>
      ${data ? `<div class="dot"></div>` : ""}
    `;

    cell.onclick = ()=>openDay(key,data);

    grid.appendChild(cell);
  }

  planner.appendChild(grid);
}

window.openDay = function(key,data){

  const panel = document.getElementById("dayPanel");
  panel.style.display="block";

  const d = new Date(key);

  panel.innerHTML = `
    <h2>${d.toDateString()}</h2>

    <h3>Tareas / Exámenes</h3>
    <textarea id="tasks">${data?.tasks||""}</textarea>

    <h3>Extra</h3>
    <textarea id="extra">${data?.extra||""}</textarea>

    ${isOwner?`<button onclick="saveDay('${key}')">Guardar</button>`:""}
  `;
};

window.saveDay = async function(key){

  if(!isOwner) return;

  await set(ref(db,"calendar/"+key),{
    tasks: document.getElementById("tasks").value,
    extra: document.getElementById("extra").value
  });

  renderCalendar();
};

window.changeMonth = function(n){
  currentDate.setMonth(currentDate.getMonth()+n);
  renderCalendar();
};

// IA
window.preguntarIA = async function(){

  const input = document.getElementById("chatInput");
  const out = document.getElementById("chatResponse");

  out.textContent="Pensando...";

  try{
    const r = await fetch("https://planillaaii.onrender.com/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:input.value})
    });

    const d = await r.json();
    out.textContent=d.reply;

  }catch(e){
    out.textContent="Error conexión IA";
  }
};

// login
function parseJwt(t){
  const b=t.split(".")[1];
  return JSON.parse(atob(b));
}

window.realGoogleHandler=function(res){

  const user=parseJwt(res.credential);

  document.getElementById("userStatus").innerText=user.email;

  isOwner = user.email===OWNER_EMAIL;

  renderCalendar();
};

renderCalendar();

</script>

<script>
function handleCredentialResponse(r){
  if(window.realGoogleHandler) window.realGoogleHandler(r);
}
</script>

<script src="https://accounts.google.com/gsi/client" async defer></script>

</body>
</html>
