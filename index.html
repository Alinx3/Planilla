<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Calendario de tareas</title>
<link rel="icon" type="image/png" href="Logo.png">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
  overflow-x:hidden;
}

.topbar {
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:10px;
}

.monthHeader {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin-bottom:10px;
}

#calendarWrapper {
  overflow:hidden;
  position:relative;
  height:420px;
}

.slide {
  position:absolute;
  width:100%;
  transition: transform 0.35s ease, opacity 0.35s ease;
}

.grid {
  display:grid;
  grid-template-columns: repeat(7, 1fr);
  gap:6px;
}

.cell {
  display:flex;
  justify-content:center;
  align-items:center;
  height:60px;
  cursor:pointer;
  position:relative;
}

.dayNumber {
  width:32px;
  height:32px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:50%;
  font-size:14px;
  transition: all 0.2s;
}

.hasEvent {
  border:2px solid black;
}

/* tipos */
.event-task { background:#dbeafe; }
.event-exam { background:#fee2e2; }
.event-extra { background:#dcfce7; }

.preview {
  position:absolute;
  bottom:65px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  white-space:pre-wrap;
  display:none;
  z-index:10;
}

#dayPanel {
  margin-top:20px;
  background:white;
  padding:15px;
  border-radius:12px;
  display:none;
}

textarea {
  width:100%;
  min-height:80px;
  margin-top:5px;
}

button {
  margin-top:8px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<h2>Calendario escolar</h2>
<h1>(Solo el creador (alan xd) y/o las personas autorizadas podran cambiar la informacion</h1>

<div class="topbar">
  <div id="g_id_onload"
    data-client_id="339716745421-9m32g145kb2pibk0ff71thv9bru2uhpd.apps.googleusercontent.com"
    data-callback="handleCredentialResponse"
    data-ux_mode="popup">
  </div>

  <div class="g_id_signin"></div>

  <span id="userStatus">No logueado</span>
</div>

<div class="monthHeader">
  <button onclick="changeMonth(-1)">◀</button>
  <h3 id="monthTitle"></h3>
  <button onclick="changeMonth(1)">▶</button>
</div>

<div id="calendarWrapper"></div>

<div id="dayPanel"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBptDjBsGFfegLCKABQt5bdcbB42Wq0vo4",
  authDomain: "data-plantilla.firebaseapp.com",
  databaseURL: "https://data-plantilla-default-rtdb.firebaseio.com",
  projectId: "data-plantilla",
  storageBucket: "data-plantilla.firebasestorage.app",
  messagingSenderId: "359795727645",
  appId: "1:359795727645:web:d75d627708129ed97555f4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const OWNER_EMAIL = "alanmosimann@gmail.com";

let currentDate = new Date();
let direction = 1;
let isOwner = false;

/* utils */
function format(d){
  return d.toISOString().split("T")[0];
}

function monthName(m){
  return ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"][m];
}

function getDays(y,m){
  let d=new Date(y,m,1);
  let arr=[];
  while(d.getMonth()===m){
    arr.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return arr;
}

/* RENDER CALENDAR */
async function renderCalendar(){

  document.getElementById("monthTitle").innerText =
    monthName(currentDate.getMonth())+" "+currentDate.getFullYear();

  const wrapper = document.getElementById("calendarWrapper");

  const slide = document.createElement("div");
  slide.className="slide";

  const days = getDays(currentDate.getFullYear(),currentDate.getMonth());

  const grid = document.createElement("div");
  grid.className="grid";

  const snap = await get(ref(db,"calendar"));
  const allData = snap.exists() ? snap.val() : {};
  
  for(let day of days){

    const key = format(day);

    const data = allData[key] || null;

    const hasContent = data && (data.tasks || data.extra);

    const cell = document.createElement("div");
    cell.className="cell";

    let colorClass = "";

    if(data){
      if(data.tasks) colorClass="event-task";
      else if(data.extra) colorClass="event-extra";
    }

    cell.innerHTML=`
      <div class="dayNumber ${hasContent?"hasEvent":""} ${colorClass}">
        ${day.getDate()}
      </div>
      <div class="preview">${(data?.tasks||"") + "\n" + (data?.extra||"")}</div>
    `;

    const preview = cell.querySelector(".preview");

    cell.onmouseenter=()=>preview.style.display="block";
    cell.onmouseleave=()=>preview.style.display="none";

    cell.onclick=()=>openDay(key,data);

    grid.appendChild(cell);
  }

  slide.appendChild(grid);

  wrapper.innerHTML="";

  slide.style.transform=`translateX(${direction*50}px)`;
  slide.style.opacity="0";

  wrapper.appendChild(slide);

  requestAnimationFrame(()=>{
    slide.style.transform="translateX(0px)";
    slide.style.opacity="1";
  });
}

/* PANEL DÍA */
window.openDay = function(key,data){

  const panel = document.getElementById("dayPanel");
  panel.style.display="block";

  const d=new Date(key);

  panel.innerHTML=`
    <h2>${d.toDateString()}</h2>

    <h3>Tareas / Exámenes</h3>
    <textarea id="tasks">${data?.tasks||""}</textarea>

    <h3>Extra</h3>
    <textarea id="extra">${data?.extra||""}</textarea>

    ${isOwner?`<button onclick="saveDay('${key}')">Guardar</button>`:""}
  `;
};

/* SAVE */
window.saveDay = async function(key){

  if(!isOwner) return;

  const tasks=document.getElementById("tasks").value.trim();
  const extra=document.getElementById("extra").value.trim();

  if(!tasks && !extra){
    await set(ref(db,"calendar/"+key),null);
  } else {
    await set(ref(db,"calendar/"+key),{
      tasks,
      extra
    });
  }

  renderCalendar();
};

/* MONTH NAV */
window.changeMonth=function(n){
  direction=n;
  currentDate.setMonth(currentDate.getMonth()+n);
  renderCalendar();
};

/* LOGIN */
function parseJwt(t){
  const b=t.split(".")[1];
  return JSON.parse(atob(b));
}

window.realGoogleHandler=function(res){

  const user=parseJwt(res.credential);

  document.getElementById("userStatus").innerText=user.email;

  isOwner = user.email===OWNER_EMAIL;

  renderCalendar();
};

renderCalendar();

</script>

<script>
function handleCredentialResponse(r){
  if(window.realGoogleHandler)
    window.realGoogleHandler(r);
}
</script>

<script src="https://accounts.google.com/gsi/client" async defer></script>

</body>
</html>
