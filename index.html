<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Calendario de tareas</title>
<link rel="icon" type="image/png" href="Logo.png">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  overflow-x: hidden;
  background-attachment: fixed;
  background-repeat: no-repeat;
  min-height: 200vh;
  transition: background 0.6s ease;
}

.topbar {
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:10px;
}

.monthHeader {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin-bottom:10px;
}

#calendarWrapper {
  overflow:hidden;
  position:relative;
  height:420px;
}

.slide {
  position:absolute;
  width:100%;
  transition: transform 0.35s ease, opacity 0.35s ease;
}

.grid {
  display:grid;
  grid-template-columns: repeat(7, 1fr);
  gap:6px;
}

.cell {
  display:flex;
  justify-content:center;
  align-items:center;
  height:60px;
  cursor:pointer;
  position:relative;
}

.dayNumber {
  width:32px;
  height:32px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:50%;
  font-size:14px;
  transition: all 0.2s;
}

.hasEvent {
  border:2px solid black;
}

.event-task { background:#dbeafe; }
.event-extra { background:#dcfce7; }

.preview {
  position:absolute;
  bottom:65px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  white-space:pre-wrap;
  display:none;
  z-index:10;
}

#dayPanel {
  margin-top:20px;
  background:white;
  padding:15px;
  border-radius:12px;
  display:none;
}

textarea, input {
  width:100%;
  min-height:40px;
  margin-top:5px;
  box-sizing:border-box;
}

button {
  margin-top:8px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

iframe {
  width:100%;
  height:250px;
  margin-top:12px;
  border:none;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>Calendario escolar</h2>
<h3>(Solo el creador y autorizados pueden editar)</h3>

<div class="topbar">
  <div id="g_id_onload"
    data-client_id="339716745421-9m32g145kb2pibk0ff71thv9bru2uhpd.apps.googleusercontent.com"
    data-callback="handleCredentialResponse"
    data-ux_mode="popup">
  </div>

  <div class="g_id_signin"></div>

  <span id="userStatus">No logueado</span>
</div>

<div class="monthHeader">
  <button onclick="changeMonth(-1)">◀</button>
  <h3 id="monthTitle"></h3>
  <button onclick="changeMonth(1)">▶</button>
</div>

<div id="calendarWrapper"></div>

<div id="dayPanel"></div>

<script type="module">

function updateBackgroundByMonth(month){

  const backgrounds = [
    "linear-gradient(to bottom, #fdf2d0, #ffd6a5)", // Enero
    "linear-gradient(to bottom, #ffe5ec, #ffc2d1)", // Febrero
    "linear-gradient(to bottom, #f8edeb, #e8e8e4)", // Marzo
    "linear-gradient(to bottom, #e0f4ff, #bde0fe)", // Abril
    "linear-gradient(to bottom, #e9f5db, #cfe1b9)", // Mayo
    "linear-gradient(to bottom, #dfe7fd, #cddafd)", // Junio
    "linear-gradient(to bottom, #d8f3dc, #b7e4c7)", // Julio
    "linear-gradient(to bottom, #fff3b0, #ffd6a5)", // Agosto
    "linear-gradient(to bottom, #e4c1f9, #d0bfff)", // Septiembre
    "linear-gradient(to bottom, #ffd6a5, #ffadad)", // Octubre
    "linear-gradient(to bottom, #caf0f8, #ade8f4)", // Noviembre
    "linear-gradient(to bottom, #ffddd2, #fec89a)"  // Diciembre
  ];

  document.body.style.background = backgrounds[month];
}

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBptDjBsGFfegLCKABQt5bdcbB42Wq0vo4",
  authDomain: "data-plantilla.firebaseapp.com",
  databaseURL: "https://data-plantilla-default-rtdb.firebaseio.com",
  projectId: "data-plantilla",
  storageBucket: "data-plantilla.firebasestorage.app",
  messagingSenderId: "359795727645",
  appId: "1:359795727645:web:d75d627708129ed97555f4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const OWNER_EMAIL = "alanmosimann@gmail.com";

let currentDate = new Date();
let direction = 1;
let isOwner = false;

function format(d){
  return d.toISOString().split("T")[0];
}

function monthName(m){
  return ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"][m];
}

function getDays(y,m){
  let d = new Date(y,m,1);
  let arr = [];
  while(d.getMonth() === m){
    arr.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return arr;
}

function youtubeEmbed(url){
  const match = url.match(/(?:v=|youtu\.be\/)([^&]+)/);
  return match ? `https://www.youtube.com/embed/${match[1]}` : "";
}

/* RENDER */
async function renderCalendar(){
  updateBackgroundByMonth(currentDate.getMonth());

  document.getElementById("monthTitle").innerText =
    monthName(currentDate.getMonth()) + " " + currentDate.getFullYear();

  const wrapper = document.getElementById("calendarWrapper");

  const slide = document.createElement("div");
  slide.className = "slide";

  const days = getDays(currentDate.getFullYear(), currentDate.getMonth());

  const grid = document.createElement("div");
  grid.className = "grid";

  const snap = await get(ref(db,"calendar"));
  const allData = snap.exists() ? snap.val() : {};

  for(let day of days){

    const key = format(day);
    const data = allData[key] || null;

    const hasContent = data && (data.tasks || data.extra || data.video);

    const cell = document.createElement("div");
    cell.className = "cell";

    let colorClass = "";
    if(data){
      if(data.tasks) colorClass = "event-task";
      else if(data.extra || data.video) colorClass = "event-extra";
    }

    cell.innerHTML = `
      <div class="dayNumber ${hasContent ? "hasEvent" : ""} ${colorClass}">
        ${day.getDate()}
      </div>
      <div class="preview">${(data?.tasks || "")}</div>
    `;

    const preview = cell.querySelector(".preview");

    cell.onmouseenter = ()=> preview.style.display = "block";
    cell.onmouseleave = ()=> preview.style.display = "none";

    cell.onclick = ()=> openDay(key, data);

    grid.appendChild(cell);
  }

  slide.appendChild(grid);

  wrapper.innerHTML = "";

  slide.style.transform = `translateX(${direction*50}px)`;
  slide.style.opacity = "0";

  wrapper.appendChild(slide);

  requestAnimationFrame(()=>{
    slide.style.transform = "translateX(0px)";
    slide.style.opacity = "1";
  });
}

/* PANEL */
window.openDay = function(key,data){

  const panel = document.getElementById("dayPanel");
  panel.style.display = "block";

  const [year, month, day] = key.split("-").map(Number);
  const d = new Date(year, month - 1, day);

  panel.innerHTML = `
    <h2>${d.toLocaleDateString("es-AR", {
      day: "numeric",
      month: "long",
      year: "numeric"
    })}</h2>

    <h3>Tareas / Exámenes</h3>
    <textarea id="tasks">${data?.tasks || ""}</textarea>

    <h3>Extra</h3>
    <textarea id="extra">${data?.extra || ""}</textarea>

    <h3>Video de YouTube</h3>
    <input id="video" value="${data?.video || ""}" placeholder="https://www.youtube.com/watch?v=...">

    ${data?.video ? `
      <iframe src="${youtubeEmbed(data.video)}" allowfullscreen></iframe>
    ` : ""}

    ${isOwner ? `<button onclick="saveDay('${key}')">Guardar</button>` : ""}
  `;
};

/* SAVE */
window.saveDay = async function(key){

  if(!isOwner) return;

  const tasks = document.getElementById("tasks").value.trim();
  const extra = document.getElementById("extra").value.trim();
  const video = document.getElementById("video").value.trim();

  if(!tasks && !extra && !video){
    await set(ref(db,"calendar/" + key), null);
  } else {
    await set(ref(db,"calendar/" + key), {
      tasks,
      extra,
      video
    });
  }

  renderCalendar();
};

/* MONTH */
window.changeMonth = function(n){
  direction = n;
  currentDate.setMonth(currentDate.getMonth() + n);
  renderCalendar();
};

/* LOGIN */
function parseJwt(t){
  const b = t.split(".")[1];
  return JSON.parse(atob(b));
}

window.realGoogleHandler = function(res){

  const user = parseJwt(res.credential);

  document.getElementById("userStatus").innerText = user.email;

  isOwner = user.email === OWNER_EMAIL;

  renderCalendar();
};

renderCalendar();

</script>

<script>
function handleCredentialResponse(r){
  if(window.realGoogleHandler){
    window.realGoogleHandler(r);
  }
}
</script>

<script src="https://accounts.google.com/gsi/client" async defer></script>

</body>
</html>
