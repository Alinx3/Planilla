<!DOCTYPE html>
<html lang="es">
<!-- Hackers: no-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planilla Escolar</title>
  

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 6px;
    }

    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .day {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .cell {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px;
      background: #fafafa;
      min-height: 42px;
      font-size: 14px;
    }

    .notes {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      border-radius: 8px;
      border: 1px solid #ccc;
      padding: 8px;
      resize: vertical;
      box-sizing: border-box;
    }

    button {
      margin-top: 8px;
      padding: 8px 12px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }

    .hidden {
      display: none;
    }

    .saved-note {
      white-space: pre-wrap;
      background: #f8f8f8;
      border-radius: 8px;
      padding: 8px;
    }
  </style>
</head>
<body>
  <h1>Planilla del Colegio</h1>
  <p>Compartible con compañeros. Solo el dueño (alanpro osiosi xd) puede editar tareas y exámenes.</p>

  <div class="topbar">
    <div id="g_id_onload"
         data-client_id="339716745421-9m32g145kb2pibk0ff71thv9bru2uhpd.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-ux_mode="popup">
    </div>

    <div class="g_id_signin" data-type="standard"></div>
    <span id="userStatus">No has iniciado sesión</span>
  </div>

  <div id="planner"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase,
      ref,
      set,
      get
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBptDjBsGFfegLCKABQt5bdcbB42Wq0vo4",
      authDomain: "data-plantilla.firebaseapp.com",
      databaseURL: "https://data-plantilla-default-rtdb.firebaseio.com",
      projectId: "data-plantilla",
      storageBucket: "data-plantilla.firebasestorage.app",
      messagingSenderId: "359795727645",
      appId: "1:359795727645:web:d75d627708129ed97555f4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const OWNER_EMAIL = "alanmosimann@gmail.com";

    const schedule = {
      "Lunes": ["14:00", "14:40", "15:30", "16:10", "17:00", "17:40", "18:20", "19:00"],
      "Martes": ["14:00", "14:40", "15:30", "16:10", "17:00", "17:40", "18:20"],
      "Miércoles": ["14:00", "14:40", "15:30", "16:10", "17:00", "17:40", "18:20", "19:00"],
      "Jueves": ["14:00", "14:40", "15:30", "16:10", "17:00", "17:40", "18:20"],
      "Viernes": ["14:00", "14:40", "15:30", "16:10", "17:00", "17:40", "18:20"]
    };

    let isOwner = false;

    async function renderPlanner() {
      const planner = document.getElementById("planner");
      planner.innerHTML = "";

      for (const [day, times] of Object.entries(schedule)) {
        const snapshot = await get(ref(db, "notes/" + day));
        const note = snapshot.exists() ? snapshot.val() : "";

        const div = document.createElement("div");
        div.className = "day";

        div.innerHTML = `
          <h2>${day}</h2>
          <div class="grid">
            ${times.map(t => `<div class="cell">${t}</div>`).join("")}
          </div>

          <div class="notes">
            <h3>Tareas / Exámenes</h3>
            <div class="saved-note">${note || "Nada cargado todavía."}</div>

            <div class="${isOwner ? "" : "hidden"}">
              <textarea id="txt-${day}">${note}</textarea>
              <button onclick="saveNote('${day}')">Guardar</button>
            </div>
          </div>
        `;

        planner.appendChild(div);
      }
    }

    window.saveNote = async function(day) {
      if (!isOwner) return;

      const value = document.getElementById("txt-" + day).value;

      await set(ref(db, "notes/" + day), value);

      renderPlanner();
    };

    function parseJwt(token) {
      const base64Url = token.split(".")[1];
      const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
      return JSON.parse(atob(base64));
    }

    window.realGoogleHandler = function(response) {
      console.log("Google respondió:", response);

      try {
        const user = parseJwt(response.credential);

        console.log("Usuario:", user);

        document.getElementById("userStatus").textContent =
          "Conectado como: " + user.email;

        isOwner = user.email === OWNER_EMAIL;

        renderPlanner();
      } catch (err) {
        console.error("Error dentro del callback:", err);
      }
  };

    renderPlanner();
  </script>
  <script>
    function handleCredentialResponse(response) {
      window.__googleResponse = response;
      if (window.realGoogleHandler) {
        window.realGoogleHandler(response);
      }
    }
</script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
